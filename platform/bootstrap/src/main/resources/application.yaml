spring:
  application:
    name: financial-backend-lab
  datasource:
    url: ${FINANCIAL_DB_URL:jdbc:postgresql://localhost:5432/financial}
    username: ${FINANCIAL_DB_USER:financial}
    password: ${FINANCIAL_DB_PASSWORD:financial_dev}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
