name: Harness

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
            gradle/verification-keyring.gpg
            settings-gradle.lockfile
            gradle.lockfile
            **/gradle.lockfile
      - name: Run Fast on Unix
        if: runner.os != 'Windows'
        run: ./gradlew harnessFast --stacktrace
      - name: Run Fast on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat harnessFast --stacktrace
      - name: Upload Fast reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-fast-${{ matrix.os }}
          path: |
            build/reports/harness/
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  full:
    name: Full (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
            gradle/verification-keyring.gpg
            settings-gradle.lockfile
            gradle.lockfile
            **/gradle.lockfile
      - name: Run Full
        run: ./gradlew harnessFull --stacktrace
      - name: Upload Full reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-full-ubuntu
          path: |
            build/reports/harness/
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
