name: Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
            gradle/verification-keyring.gpg
            settings-gradle.lockfile
            gradle.lockfile
            **/gradle.lockfile
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Run Fast on Unix
        if: runner.os != 'Windows'
        run: ./gradlew harnessFast --stacktrace
      - name: Run Fast on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat harnessFast --stacktrace
      - name: Upload Fast reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-fast-${{ matrix.os }}
          path: |
            build/reports/harness/
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  full:
    name: Full (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
            gradle/verification-keyring.gpg
            settings-gradle.lockfile
            gradle.lockfile
            **/gradle.lockfile
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Run Full
        run: ./gradlew harnessFull --stacktrace
      - name: Upload Full reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-full-ubuntu
          path: |
            build/reports/harness/
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
